# CI de Miku Assistant: lint y tests en Windows (el asistente solo corre en Windows).
name: CI

on:
  push:
    branches: [main, reestructuracion]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:                      # un push nuevo cancela el anterior de la misma rama
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-y-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Tests (pytest)
        env:
          QT_QPA_PLATFORM: offscreen     # sin pantalla: la bandeja y los subtítulos se prueban igual
        run: python -m pytest

      - name: El ejemplo de configuración está al día
        # Sale del esquema: si alguien agrega una opción y no lo regenera, acá se nota.
        run: |
          python -m miku.ajustes ejemplo
          git diff --exit-code -- config_local.py.example
