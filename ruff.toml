# Lint del proyecto:  python -m ruff check .
line-length = 120
target-version = "py310"
extend-exclude = ["venv", "extern", "data", "dist", "build"]

[lint]
# Errores reales: imports y variables sin usar, nombres indefinidos, sintaxis y trampas comunes (bugbear).
select = ["F", "E9", "B"]
# zip() sin strict=: se usa a propósito para recorrer pares consecutivos (x, x[1:]).
ignore = ["B905"]
